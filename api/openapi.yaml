  "info": {
    "description": "Normative DTOs generated from pkg/protocol. Management writes with cookie require Origin and X-CSRF-Token. Private requests/responses include X-RemoteOps-Time, X-RemoteOps-Nonce and X-RemoteOps-Signature, with v1 HMAC-SHA256 canonicalization, 60s freshness and direction-separated keys.",
    "title": "RemoteOps",
    "version": "1.0.0"
  },
  "openapi": "3.1.0",
  "paths": {
    "/api/v1/approvals": {
      "get": {
        "responses": {
          "200": {
            "content": {
