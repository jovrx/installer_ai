                "schema": {
                  "items": {
                    "$ref": "#/components/schemas/Approval"
                  },
                  "type": "array"
                }
              }
            },
            "description": "Success"
          },
          "default": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            },
            "description": "Error: invalid_request, unauthorized, forbidden, session_expired, approval_required, conflict, not_found, permission_denied or execution error"
          }
        },
        "security": [
          {
            "operatorBearer": []
          },
          {
            "browserSession": []
          }
        ],
        "summary": "List approval evidence"
      },
      "post": {
